name: Bug report
description: Report a scanner crash, incorrect CLI behavior, or broken report output.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid pasting secrets, private repository contents, or credentials.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version, commit, or branch did you run?
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: What command did you run?
      render: shell
      placeholder: "oss-safe-release scan ."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized workflow snippets or report output if useful.
